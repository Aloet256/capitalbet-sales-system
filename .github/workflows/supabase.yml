name: Deploy Capitalbet API to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capitalbet-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Deploy Edge Function
        env:
          CAPITALBET_SUPABASE_URL: ${{ vars.CAPITALBET_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ ! "$CAPITALBET_SUPABASE_URL" =~ ^https://([a-z]{20})\.supabase\.co/?$ ]]; then
            echo 'Set CAPITALBET_SUPABASE_URL to the Supabase project origin.' >&2
            exit 1
          fi
          project_ref="${BASH_REMATCH[1]}"
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo 'Set the SUPABASE_ACCESS_TOKEN repository secret for the target project.' >&2
            exit 1
          fi
          npx --yes supabase@3.2.0 functions deploy capitalbet "--remote=$project_ref" --use-api --yes
